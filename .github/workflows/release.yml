name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Google OAuth Config
        run: |
          mkdir -p lib/config
          cat << 'EOF' > lib/config/google_oauth_config.dart
          class GoogleOAuthConfig {
            static const String clientId = '${{ secrets.GOOGLE_CLIENT_ID }}';
            static const String clientSecret = '${{ secrets.GOOGLE_CLIENT_SECRET }}';
          }
          EOF
        shell: bash

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Compress Release Bundle (ZIP)
        run: |
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath "build/chronos-windows-${{ github.ref_name }}.zip"

      - name: Upload Windows Artifact to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/chronos-windows-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Google OAuth Config
        run: |
          mkdir -p lib/config
          cat << 'EOF' > lib/config/google_oauth_config.dart
          class GoogleOAuthConfig {
            static const String clientId = '${{ secrets.GOOGLE_CLIENT_ID }}';
            static const String clientSecret = '${{ secrets.GOOGLE_CLIENT_SECRET }}';
          }
          EOF
        shell: bash

      - name: Build and Package Linux DEB
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          bash build_deb.sh "$VERSION"

      - name: Upload Linux Artifact to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/chronos-*-amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
